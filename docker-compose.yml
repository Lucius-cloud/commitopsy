services:
  postgres:
    image: postgres:16-alpine
    container_name: commitopsy-postgres
    environment:
      POSTGRES_DB: commitopsy_dev
      POSTGRES_USER: commitopsy_dev
      POSTGRES_PASSWORD: commitopsy_dev_local_only
    ports:
      - "5432:5432"
    volumes:
      - commitopsy_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commitopsy_dev -d commitopsy_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  commitopsy_pgdata:
